<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-label="LUA Corporation business structure">
  <rect width="1200" height="680" fill="#ffffff"/>
  <text x="600" y="72" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">LUA Corporation Business Structure</text>
  <text x="600" y="112" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#6b7280">Building, operating data centers, and preparing land to build them.</text>
  <rect x="120" y="140" width="960" height="48" rx="12" fill="#e8f1fb"/>
  <text x="600" y="170" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#003876">Rising AI compute demand - Shortage of power and infrastructure</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="80" y="230" width="320" height="300" rx="10" fill="#fff" stroke="#0066cc" stroke-width="2"/>
    <rect x="80" y="230" width="320" height="56" rx="10" fill="#003876"/>
    <text x="240" y="265" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">Data Center Infrastructure</text>
    <text x="110" y="320" font-size="16" fill="#374151">- Power supply systems</text>
    <text x="110" y="355" font-size="16" fill="#374151">- Cooling systems</text>
    <text x="110" y="390" font-size="16" fill="#374151">- Waste heat recovery and reuse</text>

    <rect x="440" y="230" width="320" height="300" rx="10" fill="#fff" stroke="#0066cc" stroke-width="2"/>
    <rect x="440" y="230" width="320" height="56" rx="10" fill="#003876"/>
    <text x="600" y="265" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">Data Center Operations</text>
    <text x="470" y="320" font-size="16" fill="#374151">- Integrated power, cooling, compute</text>
    <text x="470" y="355" font-size="16" fill="#374151">- Equipment status and history</text>
    <text x="470" y="390" font-size="16" fill="#374151">- Energy usage management</text>

    <rect x="800" y="230" width="320" height="300" rx="10" fill="#fff" stroke="#0066cc" stroke-width="2"/>
    <rect x="800" y="230" width="320" height="56" rx="10" fill="#003876"/>
    <text x="960" y="265" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">Site Development</text>
    <text x="830" y="320" font-size="16" fill="#374151">- Power grid feasibility review</text>
    <text x="830" y="355" font-size="16" fill="#374151">- Water and permit verification</text>
    <text x="830" y="390" font-size="16" fill="#374151">- Securing buildable sites</text>
  </g>
  <rect x="80" y="560" width="1040" height="64" rx="12" fill="#003876"/>
  <text x="140" y="600" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#fff">Intellectual Property</text>
  <text x="1060" y="600" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#fff">1 registered patent - 4 applications</text>
</svg>
